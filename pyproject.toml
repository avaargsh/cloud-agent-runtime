[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cloud-agent-runtime"
version = "0.1.0"
description = "Reference runtime contracts for durable, isolated cloud Agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ben Lee" }]
keywords = ["agent-runtime", "temporal", "durable-execution", "sandbox", "agent-infrastructure"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "temporalio>=1.33,<2",
]
temporal = [
  "temporalio>=1.33,<2",
]
s3 = [
  "boto3>=1.40,<2",
]

[project.scripts]
cloud-agent-runtime-worker = "cloud_agent_runtime.temporal_worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_agent_runtime"]
