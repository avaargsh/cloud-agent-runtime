[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cloud-agent-runtime"
version = "0.1.0"
description = "Reference runtime contracts for durable, isolated cloud Agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
temporal = [
  "temporalio>=1.29,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_agent_runtime"]
