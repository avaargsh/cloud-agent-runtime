name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps, commands, inputs, and relevant logs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, component versions, and runtime details.
  - type: textarea
    id: safety
    attributes:
      label: Safety or correctness impact
      description: Does this affect authorization, evidence, replay, idempotency, durable state, or write actions?
  - type: checkboxes
    id: sensitive
    attributes:
      label: Sensitive information
      options:
        - label: I have removed credentials, private endpoints, customer data, and other sensitive information.
          required: true