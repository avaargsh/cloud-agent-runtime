name: p0-run-recovery-acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/cloud_agent_runtime/async_runtime.py"
      - "src/cloud_agent_runtime/async_workflow.py"
      - "src/cloud_agent_runtime/temporal_driver.py"
      - "src/cloud_agent_runtime/models.py"
      - "src/cloud_agent_runtime/serialization.py"
      - "src/cloud_agent_runtime/runtime.py"
      - "src/cloud_agent_runtime/sandbox.py"
      - "src/cloud_agent_runtime/kubernetes_sandbox.py"
      - "src/cloud_agent_runtime/recovery_probe.py"
      - "src/cloud_agent_runtime/temporal_worker.py"
      - "tests/test_async_runtime.py"
      - "tests/test_runtime.py"
      - "tests/test_sandbox_recovery.py"
      - "tests/test_kubernetes_sandbox.py"
      - "tests/test_temporal_driver.py"
      - "tests/test_temporal_process_recovery.py"
      - "tests/test_temporal_integration.py"
      - "tests/test_temporal_ack_drop_proxy.py"
      - "docs/recovery-acceptance.md"
      - ".github/workflows/p0-run-recovery-acceptance.yml"

permissions:
  contents: read

jobs:
  recovery-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - name: Run P0 recovery acceptance tests
        env:
          P0_RECOVERY_EVIDENCE_DIR: recovery-report
        run: |
          mkdir -p recovery-report
          pytest -q tests/test_async_runtime.py tests/test_runtime.py tests/test_sandbox_recovery.py tests/test_kubernetes_sandbox.py tests/test_temporal_driver.py tests/test_temporal_process_recovery.py tests/test_temporal_ack_drop_proxy.py && pytest -q tests/test_temporal_integration.py -k test_temporal_worker_process_sigkill_restarts_same_workflow_identity
      - name: Validate machine-readable Temporal recovery evidence
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_dir = Path("recovery-report")
          ack = json.loads((report_dir / "temporal-ack-drop-evidence.json").read_text())
          assert ack["scenario"] == "tcp_grpc_start_response_drop_then_sigkill_and_reconcile"
          assert ack["start_operation_id"] == f"agent-run-start:{ack['run_id']}"
          assert ack["workflow_id"] == f"agent-run-{ack['run_id']}"
          assert ack["temporal_status_after_recovery"] == "RUNNING"
          assert ack["workflow_execution_started_event_count"] == 1
          assert ack["duplicate_start"] == "rejected"
          assert ack["caller_exit"] == "SIGKILL"
          events = ack["proxy_events"]
          assert any(
              event.get("event") == "request_forwarded"
              and event.get("method") == "/temporal.api.workflowservice.v1.WorkflowService/StartWorkflowExecution"
              for event in events
          )
          assert any(event.get("event") == "response_frame_dropped" for event in events)

          worker = json.loads((report_dir / "temporal-worker-sigkill-evidence.json").read_text())
          assert worker["scenario"] == "worker_sigkill_while_waiting_then_replay"
          assert worker["temporal_server_mode"] == "full_local_server"
          assert worker["runtime_run_id"] and worker["session_id"] and worker["workflow_id"]
          assert worker["first_execution_run_id"]
          assert worker["worker_a_signal"] == "SIGKILL"
          assert worker["worker_a_return_code"] == -9
          assert worker["worker_b_replayed_while_alive"] is True
          assert worker["approval_events_after_duplicate_signal"] == 1
          assert worker["result_phase"] == "succeeded"
          transitions = [
              (event["from_phase"], event["to_phase"])
              for event in worker["transition_events"]
          ]
          assert transitions == [
              ("pending", "running"),
              ("running", "waiting"),
              ("waiting", "running"),
              ("running", "succeeded"),
          ]
          print("temporal_ack_drop_evidence=validated")
          print("temporal_worker_sigkill_evidence=validated")
          PY
      - name: Record acceptance evidence
        if: always()
        env:
          TESTED_SHA: ${{ github.sha }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p recovery-report
          cat > recovery-report/recovery-evidence.txt <<EOF
          exact_commit_sha=$TESTED_SHA
          python_version=$PYTHON_VERSION
          focused_test_job_status=$JOB_STATUS
          focused_test_command=pytest P0 runtime/kubernetes tests plus Temporal SIGKILL worker + start ACK-drop integration
          live_external_provider_side_effect_ack_loss=NOT RUN
          live_provider_cleanup_ack_loss=NOT RUN
          production_cluster_cleanup_acceptance=BLOCKED until the deployed provider and target cluster are available
          note=The TCP proxy and SIGKILL tests use the full local Temporal CLI dev server with local SQLite persistence; this is stronger than the legacy test service but is not production Temporal-server/provider acceptance.
          EOF
          if [ -f recovery-report/temporal-ack-drop-evidence.json ]; then
            cat recovery-report/temporal-ack-drop-evidence.json
          else
            echo "tcp_grpc_start_response_drop=NOT RUN OR TEST FAILED; no evidence JSON emitted"
          fi
          cat recovery-report/recovery-evidence.txt
      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-recovery-report-py${{ matrix.python-version }}-${{ github.sha }}
          path: recovery-report/
          if-no-files-found: warn
