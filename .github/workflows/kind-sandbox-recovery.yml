name: kind-sandbox-recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/cloud_agent_runtime/kubernetes_sandbox.py"
      - "scripts/kind-sandbox-recovery-smoke.py"
      - ".github/workflows/kind-sandbox-recovery.yml"

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: sandbox-recovery
      - name: Install runtime
        run: pip install -e .
      - name: Run real Pod loss/rebind proof
        run: |
          python scripts/kind-sandbox-recovery-smoke.py | tee /tmp/sandbox-recovery.txt
          grep -qx 'PASS' /tmp/sandbox-recovery.txt
          grep '^run_id=' /tmp/sandbox-recovery.txt
          grep '^sandbox_a=' /tmp/sandbox-recovery.txt
          grep '^sandbox_b=' /tmp/sandbox-recovery.txt
      - name: Assert only replacement Pod remains
        run: |
          test "$(kubectl -n agent-sandbox-smoke get pods --no-headers | wc -l)" -eq 1
          kubectl -n agent-sandbox-smoke get pods -o wide | tee /tmp/sandbox-pods.txt
      - name: Upload recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-recovery-proof
          path: |
            /tmp/sandbox-recovery.txt
            /tmp/sandbox-pods.txt
