name: kind-sandbox-recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/cloud_agent_runtime/kubernetes_sandbox.py"
      - "scripts/kind-sandbox-recovery-smoke.py"
      - ".github/workflows/kind-sandbox-recovery.yml"

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: sandbox-recovery
      - name: Install runtime
        run: pip install -e .
      - name: Run real Pod loss/rebind proof
        run: |
          python scripts/kind-sandbox-recovery-smoke.py | tee /tmp/sandbox-recovery.txt
          grep -qx 'PASS' /tmp/sandbox-recovery.txt
          grep '^run_id=' /tmp/sandbox-recovery.txt
          grep '^sandbox_a_ref=' /tmp/sandbox-recovery.txt
          grep '^sandbox_b_ref=' /tmp/sandbox-recovery.txt
          grep '^sandbox_a_id=' /tmp/sandbox-recovery.txt
          grep '^sandbox_b_id=' /tmp/sandbox-recovery.txt
      - name: Assert sandbox lifecycle convergence
        run: |
          sandbox_a_ref="$(sed -n 's/^sandbox_a_ref=//p' /tmp/sandbox-recovery.txt)"
          sandbox_b_ref="$(sed -n 's/^sandbox_b_ref=//p' /tmp/sandbox-recovery.txt)"
          sandbox_a_id="$(sed -n 's/^sandbox_a_id=//p' /tmp/sandbox-recovery.txt)"
          sandbox_b_id="$(sed -n 's/^sandbox_b_id=//p' /tmp/sandbox-recovery.txt)"
          test -n "$sandbox_a_ref"
          test -n "$sandbox_b_ref"
          test -n "$sandbox_a_id"
          test -n "$sandbox_b_id"
          test "$sandbox_a_ref" != "$sandbox_b_ref"
          test "$sandbox_a_id" != "$sandbox_b_id"

          dump_pods() {
            kubectl -n agent-sandbox-smoke get pods               -o custom-columns='NAME:.metadata.name,UID:.metadata.uid,PHASE:.status.phase,DELETION:.metadata.deletionTimestamp'               | tee /tmp/sandbox-pods.txt
          }

          dump_pods
          if ! kubectl -n agent-sandbox-smoke wait --for=delete "pod/$sandbox_a_id" --timeout=60s; then
            echo "old sandbox Pod did not converge to deletion: $sandbox_a_id ($sandbox_a_ref)" >&2
            dump_pods
            exit 1
          fi

          kubectl -n agent-sandbox-smoke wait --for=condition=Ready "pod/$sandbox_b_id" --timeout=60s
          dump_pods

          if kubectl -n agent-sandbox-smoke get "pod/$sandbox_a_id" >/dev/null 2>&1; then
            echo "old sandbox Pod is still observable after delete wait: $sandbox_a_id" >&2
            exit 1
          fi
          test "$(kubectl -n agent-sandbox-smoke get pods --no-headers | wc -l)" -eq 1
          test "$(kubectl -n agent-sandbox-smoke get pod "$sandbox_b_id" -o jsonpath='{.metadata.name}')" = "$sandbox_b_id"
      - name: Upload recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-recovery-proof
          path: |
            /tmp/sandbox-recovery.txt
            /tmp/sandbox-pods.txt
