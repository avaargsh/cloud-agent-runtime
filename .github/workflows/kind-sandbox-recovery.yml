name: kind-sandbox-recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/cloud_agent_runtime/kubernetes_sandbox.py"
      - "scripts/kind-sandbox-recovery-smoke.py"
      - ".github/workflows/kind-sandbox-recovery.yml"

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: sandbox-recovery
      - name: Install runtime
        run: pip install -e .
      - name: Run real Pod loss/rebind proof
        run: |
          python scripts/kind-sandbox-recovery-smoke.py | tee /tmp/sandbox-recovery.txt
          grep -qx 'PASS' /tmp/sandbox-recovery.txt
          grep '^run_id=' /tmp/sandbox-recovery.txt
          grep '^sandbox_a=' /tmp/sandbox-recovery.txt
          grep '^sandbox_b=' /tmp/sandbox-recovery.txt
      - name: Wait for old Pod deletion and assert replacement remains
        run: |
          sandbox_a="$(sed -n 's/^sandbox_a=//p' /tmp/sandbox-recovery.txt)"
          sandbox_b="$(sed -n 's/^sandbox_b=//p' /tmp/sandbox-recovery.txt)"
          test -n "$sandbox_a"
          test -n "$sandbox_b"
          test "$sandbox_a" != "$sandbox_b"
          kubectl -n agent-sandbox-smoke wait --for=delete "pod/$sandbox_a" --timeout=60s || true
          kubectl -n agent-sandbox-smoke wait --for=condition=Ready "pod/$sandbox_b" --timeout=60s
          test "$(kubectl -n agent-sandbox-smoke get pods --no-headers | wc -l)" -eq 1
          test "$(kubectl -n agent-sandbox-smoke get pod "$sandbox_b" -o jsonpath='{.metadata.name}')" = "$sandbox_b"
          kubectl -n agent-sandbox-smoke get pods -o wide | tee /tmp/sandbox-pods.txt
      - name: Upload recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-recovery-proof
          path: |
            /tmp/sandbox-recovery.txt
            /tmp/sandbox-pods.txt
