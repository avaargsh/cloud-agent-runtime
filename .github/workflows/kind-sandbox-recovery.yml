name: kind-sandbox-recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/cloud_agent_runtime/kubernetes_sandbox.py"
      - "scripts/kind-sandbox-recovery-smoke.py"
      - "tests/test_kubernetes_sandbox_integration.py"
      - ".github/workflows/kind-sandbox-recovery.yml"

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: sandbox-recovery
      - name: Install runtime
        run: pip install -e ".[dev]"
      - name: Run real namespace cleanup ACK-loss recovery across Runtime restart
        run: pytest -vv -ra tests/test_kubernetes_sandbox_integration.py
        env:
          CLOUD_AGENT_RUNTIME_KUBERNETES_INTEGRATION: "1"
      - name: Run real Pod loss/rebind proof
        run: |
          python scripts/kind-sandbox-recovery-smoke.py | tee /tmp/sandbox-recovery.txt
          grep -qx 'PASS' /tmp/sandbox-recovery.txt
          grep '^run_id=' /tmp/sandbox-recovery.txt
          grep '^sandbox_a_ref=' /tmp/sandbox-recovery.txt
          grep '^sandbox_b_ref=' /tmp/sandbox-recovery.txt
          grep '^sandbox_a_id=' /tmp/sandbox-recovery.txt
          grep '^sandbox_b_id=' /tmp/sandbox-recovery.txt
          grep '^sandbox_a_namespace=' /tmp/sandbox-recovery.txt
          grep '^sandbox_b_namespace=' /tmp/sandbox-recovery.txt
      - name: Assert sandbox lifecycle convergence
        run: |
          sandbox_a_ref="$(sed -n 's/^sandbox_a_ref=//p' /tmp/sandbox-recovery.txt)"
          sandbox_b_ref="$(sed -n 's/^sandbox_b_ref=//p' /tmp/sandbox-recovery.txt)"
          sandbox_a_id="$(sed -n 's/^sandbox_a_id=//p' /tmp/sandbox-recovery.txt)"
          sandbox_b_id="$(sed -n 's/^sandbox_b_id=//p' /tmp/sandbox-recovery.txt)"
          sandbox_a_namespace="$(sed -n 's/^sandbox_a_namespace=//p' /tmp/sandbox-recovery.txt)"
          sandbox_b_namespace="$(sed -n 's/^sandbox_b_namespace=//p' /tmp/sandbox-recovery.txt)"
          test -n "$sandbox_a_ref"
          test -n "$sandbox_b_ref"
          test -n "$sandbox_a_id"
          test -n "$sandbox_b_id"
          test -n "$sandbox_a_namespace"
          test -n "$sandbox_b_namespace"
          test "$sandbox_a_ref" != "$sandbox_b_ref"
          test "$sandbox_a_id" != "$sandbox_b_id"
          test "$sandbox_a_namespace" != "$sandbox_b_namespace"

          dump_pods() {
            kubectl get pods --all-namespaces               -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,UID:.metadata.uid,PHASE:.status.phase,DELETION:.metadata.deletionTimestamp'               | tee /tmp/sandbox-pods.txt
          }

          dump_pods
          old_namespace_gone=0
          for attempt in $(seq 1 60); do
            if ! kubectl get namespace "$sandbox_a_namespace" >/dev/null 2>&1; then
              old_namespace_gone=1
              break
            fi
            sleep 1
          done
          if [ "$old_namespace_gone" -ne 1 ]; then
            echo "old sandbox namespace did not converge to deletion: $sandbox_a_namespace ($sandbox_a_ref)" >&2
            dump_pods
            exit 1
          fi

          kubectl -n "$sandbox_b_namespace" wait --for=condition=Ready "pod/$sandbox_b_id" --timeout=60s
          dump_pods

          if kubectl get namespace "$sandbox_a_namespace" >/dev/null 2>&1; then
            echo "old sandbox namespace remains after delete wait: $sandbox_a_namespace" >&2
            exit 1
          fi
          test "$(kubectl -n "$sandbox_b_namespace" get pods --no-headers | wc -l)" -eq 1
          test "$(kubectl -n "$sandbox_b_namespace" get pod "$sandbox_b_id" -o jsonpath='{.metadata.name}')" = "$sandbox_b_id"
      - name: Upload recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-recovery-proof
          path: |
            /tmp/sandbox-recovery.txt
            /tmp/sandbox-pods.txt
