name: agentos-v32-golden

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/cloud_agent_runtime/**"
      - "scripts/kind-temporal-evidence-golden.py"
      - ".github/workflows/agentos-v32-golden.yml"

concurrency:
  group: agentos-v32-golden-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golden-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Standalone runtime fixture. Cross-repo AgentOS CI overrides this with
      # the SHA-256 digest of the Rego compiled from CapabilityIntent.
      AGENTOS_POLICY_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: agentos-v32-golden
      - name: Install runtime with Temporal support
        run: pip install -e ".[dev]"
      - name: Run Temporal + Kubernetes + Evidence Golden Slice
        run: |
          python scripts/kind-temporal-evidence-golden.py | tee /tmp/agentos-v32-golden.txt
          grep -qx 'PASS' /tmp/agentos-v32-golden.txt
          grep '^run_id=' /tmp/agentos-v32-golden.txt
          grep '^session_id=' /tmp/agentos-v32-golden.txt
          grep '^workflow_id=' /tmp/agentos-v32-golden.txt
          grep '^sandbox_a_id=' /tmp/agentos-v32-golden.txt
          grep '^sandbox_b_id=' /tmp/agentos-v32-golden.txt
          grep '^sandbox_a_namespace=' /tmp/agentos-v32-golden.txt
          grep '^sandbox_b_namespace=' /tmp/agentos-v32-golden.txt
          grep '^evidence_manifest=' /tmp/agentos-v32-golden.txt
          grep '^policy_digest=sha256:' /tmp/agentos-v32-golden.txt
          grep '^trace_id=' /tmp/agentos-v32-golden.txt
      - name: Assert real Pod replacement
        run: |
          sandbox_a_id="$(sed -n 's/^sandbox_a_id=//p' /tmp/agentos-v32-golden.txt)"
          sandbox_b_id="$(sed -n 's/^sandbox_b_id=//p' /tmp/agentos-v32-golden.txt)"
          sandbox_a_namespace="$(sed -n 's/^sandbox_a_namespace=//p' /tmp/agentos-v32-golden.txt)"
          sandbox_b_namespace="$(sed -n 's/^sandbox_b_namespace=//p' /tmp/agentos-v32-golden.txt)"
          test -n "$sandbox_a_id"
          test -n "$sandbox_b_id"
          test -n "$sandbox_a_namespace"
          test -n "$sandbox_b_namespace"
          test "$sandbox_a_id" != "$sandbox_b_id"
          test "$sandbox_a_namespace" != "$sandbox_b_namespace"

          old_namespace_gone=0
          for attempt in $(seq 1 60); do
            if ! kubectl get namespace "$sandbox_a_namespace" >/dev/null 2>&1; then
              old_namespace_gone=1
              break
            fi
            sleep 1
          done
          if [ "$old_namespace_gone" -ne 1 ]; then
            echo "old sandbox namespace did not converge to deletion: $sandbox_a_namespace" >&2
            kubectl get namespaces
            exit 1
          fi

          kubectl -n "$sandbox_b_namespace" wait             --for=condition=Ready "pod/$sandbox_b_id" --timeout=60s

          if kubectl get namespace "$sandbox_a_namespace" >/dev/null 2>&1; then
            echo "old sandbox namespace still exists" >&2
            exit 1
          fi

          test "$(
            kubectl -n "$sandbox_b_namespace" get pod               "$sandbox_b_id" -o jsonpath='{.metadata.name}'
          )" = "$sandbox_b_id"
          test "$(kubectl -n "$sandbox_b_namespace" get pods --no-headers | wc -l)" -eq 1
      - name: Upload Golden Slice proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentos-v32-golden-proof
          path: /tmp/agentos-v32-golden.txt
