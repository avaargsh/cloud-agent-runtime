name: test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - name: Run scoped lifecycle and recovery tests
        run: >-
          pytest -vv -ra
          tests/test_async_runtime.py
          tests/test_sandbox_recovery.py
          tests/test_temporal_driver.py
          tests/test_temporal_integration.py
          tests/test_temporal_workflow.py
