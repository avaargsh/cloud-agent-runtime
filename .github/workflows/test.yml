name: test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - name: Diagnose recovery and Temporal worker failure cases
        shell: bash
        run: |
          set +e
          failures=0
          for spec in \
            tests/test_sandbox_recovery.py::test_sqlite_restart_preserves_binding_and_recovers_same_run \
            tests/test_temporal_integration.py::test_temporal_worker_restart_replays_history_and_deduplicates_signal \
            tests/test_temporal_integration.py::test_temporal_deadline_survives_worker_restart_and_replay
          do
            echo "===== BEGIN $spec ====="
            timeout 90s python -m pytest -vv -ra --tb=long "$spec"
            rc=$?
            echo "===== END $spec (exit=$rc) ====="
            if [ "$rc" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "diagnostic_failures=$failures"
          test "$failures" -eq 0
