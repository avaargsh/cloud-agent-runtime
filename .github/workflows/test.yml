name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull-request acceptance must execute the advertised PR HEAD, not
          # GitHub's synthetic refs/pull/<n>/merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - name: Cache Temporal ephemeral test server
        uses: actions/cache@v4
        with:
          path: ~/.cache/temporal-test-server
          key: temporal-test-server-${{ runner.os }}-v1
          restore-keys: |
            temporal-test-server-${{ runner.os }}-
      - run: pip install -e ".[dev]"
      - run: pytest -vv -ra
